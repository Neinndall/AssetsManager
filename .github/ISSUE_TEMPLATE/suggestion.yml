name: "💡 Suggestion"
description: "Suggest a new feature or an improvement."
title: "[SUGGESTION] "
labels: ["enhancement", "status/triage"]
body:
  - type: markdown
    attributes:
      value: |
        > [!NOTE]
        > One idea per request. Keep it short and concrete.

  - type: textarea
    id: idea
    attributes:
      label: "Your idea"
      description: "What to add or improve, and why it's useful."
      placeholder: "e.g. 'Add a bulk-export option from the context menu to share selected files in one step.'"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: "Extra context (optional)"
      description: "Links, mockups, screenshots, or use cases."
      placeholder: "You can drag and drop images or paste links here."
    validations:
      required: false