name: "💡 Requests a Suggestion"
description: "Got an idea for a new feature or an improvement? We'd love to hear it!"
title: "[SUGGESTION] "
labels: ["enhancement", "status/triage"]
body:
  - type: markdown
    attributes:
      value: |
        > [!NOTE]
        > Thanks for taking the time to suggest an improvement! Please describe your proposal below.

  - type: textarea
    id: proposal
    attributes:
      label: "💡 Describe your Suggestion"
      description: "What would you like to add or improve? Please explain how you envision it working."
      placeholder: "e.g., 'Add a right-click context menu option to export images directly from the previewer...'"
    validations:
      required: true

  - type: textarea
    id: why-needed
    attributes:
      label: "🎯 Why is this needed / Use Case"
      description: "Explain the problem or limitation this solves. Why is this feature valuable?"
      placeholder: "e.g., 'Currently, exporting images requires navigating through multiple folders and confirmation dialogues, which is very tedious when exporting in bulk...'"
    validations:
      required: true

  - type: textarea
    id: other-context
    attributes:
      label: "🔍 Additional Context (Optional)"
      description: "Add any other context, mockups, screenshots, or links."
      placeholder: "You can drag and drop images or paste links here."
    validations:
      required: false