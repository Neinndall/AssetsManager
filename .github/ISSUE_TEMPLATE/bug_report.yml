name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior."
title: "[BUG] "
labels:
  - "bug"
  - "triage"
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Thanks for reporting! Only the description and version are required.

  - type: textarea
    id: bug
    attributes:
      label: "What happened?"
      description: "What did you do and what went wrong? Optionally note what you expected instead."
      placeholder: "e.g. 'Bulk-exporting .bin files crashes the app. Expected: a ZIP with the selected files.'"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: "Reproduce (optional)"
      description: "Steps, or a screenshot/video/link."
      placeholder: |
        1. Open...
        2. Click...
        3. See error.
        (or drag a screenshot here)
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: "Version & OS"
      description: "e.g., app version (Help -> About) and OS."
      placeholder: "v4.1.0.3 · Windows 11 x64"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Logs (optional)"
      description: "Relevant lines from the `logs` folder (e.g., `application_errors.log`)."
      render: shell
    validations:
      required: false