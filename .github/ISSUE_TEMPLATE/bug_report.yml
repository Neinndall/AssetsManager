name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior in the application."
title: "[BUG] "
labels: 
  - "bug"
  - "triage"
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]  
        > Thanks for taking the time to fill out this bug report!
        > Please provide the information below to help us investigate.

  - type: textarea
    id: description
    attributes:
      label: "📝 Bug Description"
      description: "Clearly describe the problem. What were you doing? What happened, and what did you expect to happen?"
      placeholder: "A clear and concise description of the bug, including expected vs actual behavior."
    validations:
      required: true
      
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: "🛠️ Steps to Reproduce (Optional)"
      description: "List the exact steps to reproduce the behavior if applicable."
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: false
      
  - type: textarea
    id: screenshots
    attributes:
      label: "📸 Screenshots or Videos (Optional)"
      description: "Attach screenshots or a short video showing the problem."
      placeholder: "Drag and drop images or videos here, or paste links."
    validations:
      required: false
      
  - type: input
    id: version
    attributes:
      label: "AssetsManager Version"
      description: "e.g., v4.1.0.3 (found in the Help -> About window)"
      placeholder: "v4.x.y.z"
    validations:
      required: true
      
  - type: input
    id: environment
    attributes:
      label: "Operating System & Environment (Optional)"
      description: "e.g., Windows 11 x64, Update (or Clean Installation)"
      placeholder: "Windows 11 x64"
    validations:
      required: false
      
  - type: textarea
    id: log-files
    attributes:
      label: "📄 Log Files (Optional)"
      description: |
        Please provide relevant log entries if available. You can find log files in the `logs` folder:
        - `application.log`: General application logs.
        - `application_errors.log`: Critical errors.
      render: shell
    validations:
      required: false
      
  - type: textarea
    id: additional-context
    attributes:
      label: "💡 Additional Context (Optional)"
      description: "Any other information or specific configurations."
    validations:
      required: false